<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="nav-bar">
            <div class="brand"><span class="icon">⚒</span> CUSTOM CLIENT</div>
            <nav class="nav-links">
                <a href="#" class="active">Play</a>
                <a href="#">Mods</a>
                <a href="#">Skins</a>
                <a href="#">Servers</a>
            </nav>
        </header>

        <main class="hero-viewport">
            <div class="hero-content">
                <h2>Minecraft 1.21.1</h2>
                <button class="btn-secondary">Change Version</button>
            </div>
            
            <div class="sidebar-actions">
                <div class="action-icon">💬</div>
                <div class="action-icon">👥</div>
                <div class="action-icon terminal">&gt;_</div>
            </div>
        </main>

        <footer class="footer-strip" id="playBtn">
            <div class="footer-main-text">START SESSION</div>
            <div class="footer-sub-text">Status: Offline (Brenn_Dev) - Mod Manager Active</div>
        </footer>

        <div class="modal-overlay" id="modal">
            <div class="modal-card">
                <h3>Select Your Mod Loader & Join Mode</h3>
                <hr>
                
                <p class="section-label">Select Your Mod Loader</p>
                <div class="loader-grid">
                    <div class="loader-card" data-loader="forge">
                        <span class="loader-icon">⚒</span>
                        <span class="loader-name">Forge</span>
                    </div>
                    <div class="loader-card" data-loader="neoforge">
                        <span class="loader-icon">📦</span>
                        <span class="loader-name">NeoForge</span>
                    </div>
                    <div class="loader-card" data-loader="quilt">
                        <span class="loader-icon">💠</span>
                        <span class="loader-name">Quilt</span>
                    </div>
                    <div class="loader-card" data-loader="fabric">
                        <span class="loader-icon">📜</span>
                        <span class="loader-name">Fabric</span>
                    </div>
                </div>

                <div class="auth-section">
                    <p class="section-label">Server Join Mode</p>
                    <label class="checkbox-container">
                        <input type="checkbox" id="onlineMode">
                        <span class="checkmark"></span>
                        <div class="checkbox-text">
                            <strong>Enable Online Mode (Microsoft Auth)</strong>
                            <span class="desc">Requires a valid Microsoft account to join official online servers. Leave unchecked for Offline Mode (Brenn_Dev).</span>
                        </div>
                    </label>
                </div>

                <div class="modal-actions">
                    <button class="btn-cancel" id="cancelBtn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.tauri;
        
        const playBtn = document.getElementById('playBtn');
        const modal = document.getElementById('modal');
        const cancelBtn = document.getElementById('cancelBtn');
        const onlineModeCheckbox = document.getElementById('onlineMode');

        // Toggle configuration dialog open/close states
        playBtn.addEventListener('click', () => modal.classList.add('open'));
        cancelBtn.addEventListener('click', () => modal.classList.remove('open'));

        // Handle loader selections
        document.querySelectorAll('.loader-card').forEach(card => {
            card.addEventListener('click', async () => {
                const loader = card.getAttribute('data-loader');
                const isOnline = onlineModeCheckbox.checked;
                
                modal.classList.remove('open');
                console.log(`Launching ${loader} inside engine context...`);

                // Fire the Rust engine invocation handle
                try {
                    await invoke('launch_game', { 
                        payload: { loader, onlineMode: isOnline, version: "1.21.1" } 
                    });
                } catch (error) {
                    alert("Launch failed: " + error);
                }
            });
        });
    </script>
</body>
</html>
