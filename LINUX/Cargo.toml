[package]
name = "fusion-launcher-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
lighty-launcher = { version = "0.8.6", features = ["all-loaders", "events"] }
directories = "6.0.0"
once_cell = "1.19.0"
tokio = { version = "1.38.0", features = ["full"] }
anyhow = "1.0.86"
eframe = "0.27.2" # Cleaned up feature flags
reqwest = { version = "0.12.4", features = ["json", "blocking"] }
serde = { version = "1.0.203", features = ["derive"] }
zip = "2.1.3"
chrono = "0.4.44"
serde_json = "1.0.149"

[patch.crates-io]
lighty-loaders = { path = "vendor/lighty-loaders-0.8.6" }
